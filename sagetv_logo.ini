; SageTV Android Logo Generator 1.8.0
; CairoSVG-only. Linux/docker friendly. No Inkscape required.

[general]
output_root = generated
renderer = cairosvg
; Supersample every raster deliverable from the vector master. The Android TV
; cover is then reduced once with Lanczos instead of being enlarged from a
; 512px intermediate by the launcher.
master_render_size = 2048
create_preview = yes


[fonts]
enabled = yes
required = yes
directories = M_PLUS_Rounded_1c
search_parent_directories = yes
recursive = yes
required_files = MPLUSRounded1c-ExtraBold.ttf

font_name_aliases =
    Rounded Mplus 1c, Ultra-Bold => M PLUS Rounded 1c, ExtraBold
    Rounded Mplus 1c => M PLUS Rounded 1c
    M_PLUS_Rounded_1c => M PLUS Rounded 1c

save_report = yes


[launcher]
; Keep the complete wordmark inside legacy/Fire TV icon masks. A full-canvas
; square is visibly clipped by the rounded Fire OS API-30 launcher tile.
scale = 0.80
offset_x = 0
offset_y = 0


[round_icon]
antialias_scale = 4


[adaptive_icon]
artwork_layer = foreground
background_color = #05004A
; Android guarantees the central 66/108dp adaptive safe zone. Keep text and
; the VIBE mark inside it across circular and rounded-square masks.
scale = 0.60
offset_x = 0
offset_y = 0


[banner]
width = 320
height = 180
mode = cover
scale = 1.00
offset_x = 0
offset_y = 0
background_color = #000000


[in_app_logo]
width = 320
height = 150
render_size = 1024

groups = TEXT, flower, wave
require_all_groups = yes
save_debug_files = yes

trim_transparent_margins = no
trim_alpha_threshold = 1
trim_padding = 0

mode = cover
scale = 1.00
offset_x = 0
offset_y = -15
background_color = transparent
