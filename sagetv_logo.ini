; SageTV Android Logo Generator 1.6.4
; CairoSVG-only. Linux/docker friendly. No Inkscape required.

[general]
output_root = generated
renderer = cairosvg
master_render_size = 512
create_preview = yes


[fonts]
enabled = yes
required = yes
directories = M_PLUS_Rounded_1c
search_parent_directories = yes
recursive = yes
required_files = MPLUSRounded1c-ExtraBold.ttf

font_name_aliases =
    Rounded Mplus 1c, Ultra-Bold => M PLUS Rounded 1c, ExtraBold
    Rounded Mplus 1c => M PLUS Rounded 1c
    M_PLUS_Rounded_1c => M PLUS Rounded 1c

save_report = yes


[launcher]
scale = 1.00
offset_x = 0
offset_y = 0


[round_icon]
antialias_scale = 4


[adaptive_icon]
artwork_layer = background
background_color = transparent
scale = 1.00
offset_x = 0
offset_y = 0


[banner]
width = 320
height = 180
mode = cover
scale = 1.00
offset_x = 0
offset_y = 0
background_color = #000000


[in_app_logo]
width = 320
height = 150
render_size = 1024

groups = TEXT, flower, wave
require_all_groups = yes
save_debug_files = yes

trim_transparent_margins = no
trim_alpha_threshold = 1
trim_padding = 0

mode = cover
scale = 1.00
offset_x = 0
offset_y = -15
background_color = transparent
